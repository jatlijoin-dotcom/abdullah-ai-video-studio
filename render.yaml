# Abdullah AI Video Studio — Render Blueprint
# Apply from the Render Dashboard: New → Blueprint → select this repo.
# The service is created on the FREE plan in Demo Mode (DEMO_MODE=true).
# No secrets are stored in this file: keys marked `sync: false` are
# requested by Render during setup and live only in the dashboard's
# environment variables — never in code, chat or the repo.
# Verified against the official Render Blueprint spec (2026-11-22):
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: abdullah-ai-video-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_PATH
        value: /app/storage/studio.db
      - key: STORAGE_PATH
        value: /app/storage
      # Provider keys — Render asks for these when the Blueprint is
      # applied. Leave them empty until she approves real generation.
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
